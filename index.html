<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Windows Nostalgia</title>
  </head>
  <body>
    <div class="window">
      <div class="border">Kernel Panic</div>
      <div class="content">
        <div class="icon">
          <img
            src="https://i.postimg.cc/wTQJ3hgb/error.png"
            width="35"
            height="35"
            alt="Error icon"
          />
        </div>
        <div class="message">
          <p>Please shut down your computer, and go for a walk.</p>
        </div>
        <div class="actions">
          <button class="btn" aria-label="Cancel">Cancel</button>
        </div>
      </div>
    </div>
  </body>
</html>
